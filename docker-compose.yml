services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: aisp, POSTGRES_PASSWORD: aisp, POSTGRES_DB: aisp }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "aisp"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://aisp:aisp@db:5432/aisp?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
volumes:
  pgdata:
  redisdata:
